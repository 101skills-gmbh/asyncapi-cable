name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      npm_release_created: ${{ steps.release.outputs['.--release_created'] }}
      gem_release_created: ${{ steps.release.outputs['ruby--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The openapi-ruby org forbids GITHUB_TOKEN from opening pull
          # requests, so release-please needs its own token to raise the
          # release PR — same arrangement as openapi-ruby/openapi-ruby.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.npm_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; node ships an older npm.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Publish via npm for OIDC Trusted Publishing (pnpm does not support it yet).
      - run: npm publish --access public

  publish-gem:
    needs: release-please
    if: needs.release-please.outputs.gem_release_created == 'true'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby
          bundler-cache: false
      - run: bundle install --jobs 4
      - run: bundle exec rspec
      # Trusted Publishing (OIDC) — no API key in secrets. The pairing is bound
      # to this repository on the gem's RubyGems page.
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: gem build asyncapi_cable.gemspec
      - run: gem push asyncapi_cable-*.gem
