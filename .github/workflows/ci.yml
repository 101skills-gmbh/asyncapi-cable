name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets: a PR stacked on another branch
  # would otherwise merge with no test job having run at all.
  pull_request:
  # Required for the merge queue: queued entries run against a merge_group
  # ref, and a required check that never reports there drops the entry when
  # the queue's check timeout expires.
  merge_group:

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  ruby-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # Reads ruby/.tool-versions. The gem ships no Gemfile.lock (gem
          # convention), so bundler-cache has nothing to key a cache off —
          # resolve on each run instead.
          working-directory: ruby
          bundler-cache: false
      - run: bundle install --jobs 4
      - run: bundle exec rspec
      - run: bundle exec standardrb
